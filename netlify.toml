[build]
  # `npm run build` kopieert SSR naar root .netlify (zie package.json).
  command = "npm run build"
  publish = "astro-app/dist"
  # exit 0 = build overslaan: alleen .md, .github/ of .vscode/ gewijzigd (zie _standards/DEPLOY.md)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude).github/' ':(exclude).vscode/'"

[build.environment]
  NODE_VERSION = "22"

# Geen [[plugins]] @netlify/plugin-astro (bestaat niet). SSR via @astrojs/netlify.
# In Netlify UI: Base directory leeg, Package directory leeg of "astro-app",
# Publish directory "astro-app/dist" (of leeg zodat deze toml wint).

# Required Environment Variables for Netlify:
# Set these in Netlify Dashboard > Site Settings > Environment Variables
#
# PUBLIC_SANITY_STUDIO_PROJECT_ID - Your Sanity project ID (default: "mqkdg673")
# PUBLIC_SANITY_STUDIO_DATASET - Your Sanity dataset (default: "production")
# SANITY_API_READ_TOKEN - Optional: Sanity API read token for authenticated queries
# VITE_SITE_URL - Optional: Site URL for sitemap generation
# PUBLIC_SANITY_STUDIO_URL - Optional: Sanity Studio URL (default: "http://localhost:3333")
